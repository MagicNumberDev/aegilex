[workspace]
members = [
    "rust/crates/aegilex-runtime",
    "rust/crates/aegilex-core-bindgen",
    "rust/crates/xtask",
]
default-members = ["rust/crates/aegilex-runtime"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/killcerr/aegilex"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
